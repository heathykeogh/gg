services:
  web:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - CHOKIDAR_USEPOLLING=true
      - WATCHMAN_POLLING=true
      - EXPO_NO_TELEMETRY=1
    command:
      - sh
      - -ec
      - |
        yarn install --non-interactive &&
        exec npx expo start --web --port 3000 --host lan
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: on-failure
